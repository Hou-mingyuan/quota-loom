name: Feature request
description: 建议新功能或体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述使用场景，而不只是期望的实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
